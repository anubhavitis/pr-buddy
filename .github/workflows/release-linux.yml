name: release-linux

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: ./package-linux.sh
      # The extension zip is architecture-independent, so release-mac ships it
      # and this job uploads host binaries only. Either workflow may reach the
      # tag first, so both create-or-join the same release.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in 1 2 3 4 5; do
            gh release create "$GITHUB_REF_NAME" --generate-notes && break
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 5
          done
          gh release upload "$GITHUB_REF_NAME" \
            dist/pr-buddy-host-linux-amd64 \
            dist/pr-buddy-host-linux-arm64 \
            --clobber
