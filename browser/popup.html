<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #59636e;
        --border: #d0d7de;
        --accent: #0969da;
        --ok: #1a7f37;
        --bad: #cf222e;
        --input: #f6f8fa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #e6edf3;
          --muted: #8b949e;
          --border: #30363d;
          --accent: #58a6ff;
          --ok: #3fb950;
          --bad: #f85149;
          --input: #161b22;
        }
      }
      body {
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 12px;
        width: 280px;
        background: var(--bg);
        color: var(--fg);
      }
      h1 {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        margin: 0 0 10px;
      }
      h1 img {
        width: 18px;
        height: 18px;
        border-radius: 4px;
      }
      p {
        margin: 0 0 8px;
        color: var(--muted);
      }
      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: var(--fg);
      }
      select,
      input,
      button {
        font: inherit;
        color: var(--fg);
        background: var(--input);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 8px;
      }
      button {
        width: 100%;
        cursor: pointer;
        margin-top: 4px;
      }
      button:hover {
        border-color: var(--accent);
      }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      #mlx-fields input {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <h1>
      <img src="icons/icon32.png" alt="" />
      pr-buddy
    </h1>
    <p id="page">checking page…</p>
    <p id="host">checking host…</p>
    <p>
      <label>backend
        <select id="backend">
          <option value="claude">claude</option>
          <option value="grok">grok</option>
          <option value="mlx">mlx</option>
        </select>
      </label>
    </p>
    <p id="mlx-fields" hidden>
      <input id="mlx-url" type="text" placeholder="http://127.0.0.1:8080/v1" />
      <input id="mlx-model" type="text" placeholder="model id" />
    </p>
    <button type="button" id="reload">reload this tab</button>
    <script src="out/popup.js"></script>
  </body>
</html>
