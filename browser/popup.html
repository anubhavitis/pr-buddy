<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="out/popup.css" />
  </head>
  <body class="m-0 w-[300px] bg-bg p-3.5 font-sans text-[13px] leading-snug text-ink">
    <h1 class="mb-3 mt-0 flex items-center gap-2 font-mono text-[13px] font-semibold tracking-tight text-add">
      <img src="icons/icon32.png" alt="" class="h-[18px] w-[18px] rounded-[5px]" />
      pr-buddy
    </h1>
    <p id="page" class="mb-2 mt-0 font-mono text-[12px] text-muted">checking page…</p>
    <p id="host" class="mb-3 mt-0 font-mono text-[12px]">checking host…</p>
    <p class="mb-2 mt-0">
      <label class="flex items-center justify-between gap-2">
        <span class="font-mono text-[10.5px] font-semibold uppercase tracking-[0.11em] text-muted">backend</span>
        <select
          id="backend"
          class="rounded-lg border border-line bg-raise px-2 py-1 font-mono text-[12px] text-ink transition hover:border-add focus:border-add focus:outline-none"
        >
          <option value="claude">claude</option>
          <option value="grok">grok</option>
          <option value="mlx">mlx</option>
        </select>
      </label>
    </p>
    <p class="mb-2 mt-0">
      <label class="grid gap-1">
        <span class="font-mono text-[10.5px] font-semibold uppercase tracking-[0.11em] text-muted">model</span>
        <select
          id="model-pick"
          class="rounded-lg border border-line bg-raise px-2 py-1.5 font-mono text-[12px] text-ink transition hover:border-add focus:border-add focus:outline-none"
          hidden
        ></select>
        <input
          id="model"
          type="text"
          placeholder="CLI default"
          class="box-border w-full rounded-lg border border-line bg-raise px-2 py-1.5 font-mono text-[12px] text-ink transition focus:border-add focus:outline-none"
        />
      </label>
    </p>
    <p id="mlx-fields" class="mb-2 mt-0 grid gap-1.5" hidden>
      <input
        id="mlx-url"
        type="text"
        placeholder="http://127.0.0.1:8080/v1"
        class="box-border w-full rounded-lg border border-line bg-raise px-2 py-1.5 font-mono text-[12px] text-ink transition focus:border-add focus:outline-none"
      />
    </p>
    <details class="mb-3 mt-0">
      <summary class="cursor-pointer font-mono text-[10.5px] font-semibold uppercase tracking-[0.11em] text-muted">View prompt format</summary>
      <pre id="prompt" class="mt-2 max-h-40 overflow-auto whitespace-pre-wrap break-words rounded-lg border border-line bg-sunk p-2 font-mono text-[10px] leading-snug text-ink"></pre>
    </details>
    <button
      type="button"
      id="reload"
      class="mt-1 w-full cursor-pointer rounded-lg border border-add bg-add px-2 py-1.5 font-mono text-[12px] font-semibold text-bg transition hover:-translate-y-px hover:opacity-90 active:translate-y-0"
    >
      reload this tab
    </button>
    <script src="out/popup.js"></script>
  </body>
</html>
