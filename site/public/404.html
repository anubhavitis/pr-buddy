<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found: pr-buddy</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#fdfaf5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0d1117;
        --ink: #e6edf3;
        --muted: #9aa4b0;
        --add: #3fb950;
        --mark: #d29922;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fdfaf5;
          --ink: #14181d;
          --muted: #5c6470;
          --add: #1a7f37;
          --mark: #8a6100;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--muted);
        font: 13px/1.7 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      p {
        margin: 0;
      }
      .code {
        color: var(--ink);
      }
      a {
        color: var(--add);
        text-underline-offset: 3px;
      }
      a:focus-visible {
        outline: 2px solid var(--mark);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <p>
